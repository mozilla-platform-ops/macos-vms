name: Build macOS VM (PR and Main)

on:
  workflow_dispatch:
  # SECURITY (Bug 2049579): do NOT trigger on pull_request. This job runs on a
  # non-ephemeral self-hosted runner; a fork PR would execute attacker-controlled
  # code there. Build only from trusted base-repo refs (push to main / dispatch).
  push:
    branches: [ main ]
    paths:
      - 'mac/tester15/**'
      - '.github/workflows/build-mac.yaml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY_HOST: 10.49.56.161
  REGISTRY_PORT: 5000
  REGISTRY_IMAGE: sequoia-tester
  TART_INSECURE: "--insecure"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Set up PATH for Apple Silicon Homebrew
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Kill any stuck tart build processes
        run: pkill -9 -f "tart run sequoia-" 2>/dev/null || true

      # Reclaim disk before building. The runner's Data volume has filled up
      # historically (tart's OCI pull cache + leftover build VMs), causing builds
      # to die mid-run. Prune the cache + any stale build VM, then fail fast if
      # still critically low rather than producing a corrupt image.
      - name: Reclaim disk + guard free space
        run: |
          echo "Disk before:"; df -h /System/Volumes/Data | tail -1
          /opt/homebrew/bin/tart delete sequoia-tester 2>/dev/null || true
          /opt/homebrew/bin/tart prune 2>/dev/null || true
          echo "Disk after:";  df -h /System/Volumes/Data | tail -1
          avail=$(df -g /System/Volumes/Data | awk 'NR==2{print $4}')
          echo "Free: ${avail:-?} GiB"
          if [ "${avail:-0}" -lt 30 ]; then
            echo "::error::Only ${avail} GiB free on the runner (<30 GiB) after prune — investigate m4-116 disk before building."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew tap cirruslabs/cli || true
          brew install packer cirruslabs/cli/tart ansible || true

      # Decide tags and which vault to use
      - name: Determine vault & tags
        id: determine
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF_NAME}"

          # Always build CREDENTIAL-FREE with the fake vault. Real Taskcluster
          # creds are never baked into the image; the tart host injects the real
          # vault at VM launch (ronin_puppet tart.inject_vault + tester15
          # vault-inject.sh). The runner therefore never holds a worker secret
          # (Bug 2049579 remediation).
          echo "VAULT_FILE=${{ github.workspace }}/mac/tester15/vault-fake.yaml" >> $GITHUB_ENV

          if [[ ( "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ) && "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "main build -> prod tags (credential-free)"
            echo "ALIAS_TAG=prod-latest" >> $GITHUB_ENV
            echo "BUILD_TAG=prod-${GITHUB_SHA}" >> $GITHUB_ENV
          else
            echo "non-main build -> pr tags (credential-free)"
            echo "ALIAS_TAG=pr-${{ github.event.pull_request.number }}-latest" >> $GITHUB_ENV
            echo "BUILD_TAG=pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}" >> $GITHUB_ENV
          fi

          echo ""
          echo "✅ Environment so far:"
          cat $GITHUB_ENV | grep -E 'VAULT_FILE|BUILD_TAG|ALIAS_TAG' || true
          echo ""

      # (Removed: staging /etc/ronin/vault-real.yaml. The image is credential-free
      # and the runner holds no worker secret — creds are injected at VM boot.)

      # Optional: masked hash to confirm we’re reading a file without leaking content
      - name: Log vault hash (masked)
        run: |
          if [ -f "${VAULT_FILE}" ]; then
            sha=$(shasum -a 256 "${VAULT_FILE}" | cut -d' ' -f1)
            echo "Vault file hash (for verification only): ${sha:0:8}..."
          else
            echo "⚠️ Vault file not found at ${VAULT_FILE}"
          fi

      # Build
      - name: Run macOS VM build
        working-directory: mac/tester15
        env:
          VM_NAME: sequoia-tester
          VAULT_FILE: ${{ env.VAULT_FILE }}
        run: |
          set -euo pipefail
          echo "🏗️ Using VAULT_FILE=$VAULT_FILE"
          echo "🔍 Verifying vault exists and is readable..."
          if [[ ! -f "$VAULT_FILE" ]]; then
            echo "❌ Missing vault: $VAULT_FILE"
            ls -lah "$(dirname "$VAULT_FILE")" || true
            exit 1
          fi
          echo "✅ Vault found; sha256=$(shasum -a 256 "$VAULT_FILE" | cut -d' ' -f1)"
          chmod +x builder.sh
          # 👇 Ensure absolute path is passed to packer
          export VAULT_FILE=$(realpath "$VAULT_FILE")
          ./builder.sh

      - name: Verify registry connectivity
        run: |
          echo "🔍 Testing http://${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/v2/"
          curl -fsSL http://${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/v2/ || \
            echo "⚠️ Registry reachable but returned non-200"

      # `tart login` stores the builder credential in the login keychain, but
      # the build host auto-logs-in at boot, and autologin does NOT unlock the
      # login keychain — so tart login fails with
      #   "Keychain failed to add item: User interaction is not allowed."
      # The unlock is per-security-session, so a manual `security unlock-keychain`
      # in an SSH/console shell does NOT reach the runner's session — it has to
      # happen here, in the same session as tart login. Needs a KEYCHAIN_PASSWORD
      # repo secret (= the runner admin account's login password).
      - name: Unlock login keychain for tart login
        if: ${{ success() }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${KEYCHAIN_PASSWORD}" ]; then
            echo "❌ KEYCHAIN_PASSWORD secret not set — tart login needs an unlocked login keychain"
            exit 1
          fi
          KC="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "$KC"
          # Keep it unlocked for the rest of the job (no idle/sleep relock mid-build).
          security set-keychain-settings -t 7200 "$KC"
          echo "🔓 login keychain unlocked for this runner session"

      # The registry now enforces authenticated push (anon pull / auth push,
      # Bug 2049579 rec #4). Log in with the builder credential from a repo
      # secret before pushing. Pulls (tester hosts) stay anonymous.
      - name: Log in to the OCI registry (push)
        if: ${{ success() }}
        env:
          REGISTRY: ${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}
          REGISTRY_PUSH_PASSWORD: ${{ secrets.REGISTRY_PUSH_PASSWORD }}
        run: |
          if [ -z "${REGISTRY_PUSH_PASSWORD}" ]; then
            echo "❌ REGISTRY_PUSH_PASSWORD secret not set — cannot push to the auth'd registry"
            exit 1
          fi
          printf '%s' "${REGISTRY_PUSH_PASSWORD}" | tart login "${REGISTRY}" --username builder --password-stdin --insecure
          echo "✅ logged in to ${REGISTRY} as builder"

      - name: Push built VM to local OCI registry
        if: ${{ success() }}
        env:
          REGISTRY: ${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          echo "🚀 Pushing ${IMAGE}:${BUILD_TAG} to ${REGISTRY} ..."
          tart push $TART_INSECURE ${IMAGE} ${REGISTRY}/${IMAGE}:${BUILD_TAG}

      - name: Tag and push alias (branch-latest or prod-latest)
        if: ${{ success() }}
        env:
          REGISTRY: ${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          echo "🪶 Tagging ${IMAGE}:${ALIAS_TAG} to ${REGISTRY} ..."
          tart push $TART_INSECURE ${IMAGE} ${REGISTRY}/${IMAGE}:${ALIAS_TAG}

      - name: Clean up local tester VM
        if: always()
        run: /opt/homebrew/bin/tart delete sequoia-tester 2>/dev/null || true

      - name: Summary
        if: ${{ success() }}
        run: |
          echo ""
          echo "✅ Build complete!"
          echo "  Registry: http://${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/v2/"
          echo "  Image:    ${{ env.REGISTRY_IMAGE }}"
          echo "  Tag:      $BUILD_TAG"
          echo "  Alias:    $ALIAS_TAG"
          echo ""