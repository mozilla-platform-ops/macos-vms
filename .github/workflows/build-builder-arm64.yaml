name: Build macOS Builder ARM64 VMs

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'mac/builder-arm64/**'
      - '.github/workflows/build-builder-arm64.yaml'
  push:
    branches: [ main ]
    paths:
      - 'mac/builder-arm64/**'
      - '.github/workflows/build-builder-arm64.yaml'
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: 'Force rebuild of base image from IPSW (slow, ~17 min extra)'
        required: false
        default: 'false'
      role:
        description: 'Role to build (gecko_1_b_osx_arm64, gecko_3_b_osx_arm64, or both)'
        required: false
        default: 'both'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Zot OCI registry running on macmini-m4-116.test.releng.mdc1.mozilla.com
  # Managed by LaunchDaemon org.mozilla.zot, data at /var/lib/zot
  REGISTRY_HOST: 10.49.56.83
  REGISTRY_PORT: 5000
  TART_INSECURE: "--insecure"

jobs:
  build-gecko-1b:
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.role == 'both' ||
      inputs.role == 'gecko_1_b_osx_arm64'
    runs-on: self-hosted
    steps:
      - name: Set up PATH for Apple Silicon Homebrew
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Kill any stuck tart build processes
        run: |
          pkill -9 -f "tart run sequoia-" 2>/dev/null || true
          sleep 5

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew tap cirruslabs/cli || true
          brew install packer cirruslabs/cli/tart || true

      - name: Determine vault and tags
        id: determine
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ALIAS_TAG=gecko1b-prod-latest" >> $GITHUB_ENV
            echo "BUILD_TAG=gecko1b-prod-${GITHUB_SHA}" >> $GITHUB_ENV
          else
            echo "VAULT_FILE=${{ github.workspace }}/mac/builder-arm64/vault-fake.yaml" >> $GITHUB_ENV
            echo "ALIAS_TAG=gecko1b-pr-${{ github.event.pull_request.number }}-latest" >> $GITHUB_ENV
            echo "BUILD_TAG=gecko1b-pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Stage real vault (main branch only)
        if: github.ref_name == 'main'
        run: |
          # gecko_1 and gecko_3 have different TC client IDs / access tokens,
          # so each role has its own vault file on the runner.
          # See: /etc/ronin/vault-gecko1b.yaml and vault-gecko3b.yaml
          install -m 600 /etc/ronin/vault-gecko1b.yaml "${GITHUB_WORKSPACE}/mac/builder-arm64/vault-gecko1b.yaml"
          echo "VAULT_FILE=${GITHUB_WORKSPACE}/mac/builder-arm64/vault-gecko1b.yaml" >> $GITHUB_ENV

      - name: Log vault hash
        run: |
          if [[ -f "${VAULT_FILE:-}" ]]; then
            sha=$(shasum -a 256 "${VAULT_FILE}" | cut -d' ' -f1)
            echo "Vault hash: ${sha:0:8}..."
          else
            echo "Vault file not found at ${VAULT_FILE:-<unset>}"
          fi

      - name: Build gecko-1b image
        working-directory: mac/builder-arm64
        env:
          ROLE: gecko_1_b_osx_arm64_vms
          REBUILD_BASE: ${{ inputs.rebuild_base || 'false' }}
          PUPPET_BRANCH: master
          PACKER_LOG: 1
        run: |
          set -euo pipefail
          export VAULT_FILE=$(realpath "${VAULT_FILE}")
          chmod +x builder.sh
          ./builder.sh

      - name: Verify registry connectivity
        run: |
          curl -fsSL http://${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/v2/ || \
            echo "Registry check returned non-200 (may still be functional)"

      - name: Push gecko-1b to OCI registry
        if: success()
        run: |
          REGISTRY="${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}"
          IMAGE="sequoia-gecko1b-vms"
          echo "Pushing ${IMAGE}:${BUILD_TAG} to ${REGISTRY}..."
          tart push ${{ env.TART_INSECURE }} ${IMAGE} ${REGISTRY}/${IMAGE}:${BUILD_TAG}
          tart push ${{ env.TART_INSECURE }} ${IMAGE} ${REGISTRY}/${IMAGE}:${ALIAS_TAG}

      - name: Clean up local gecko-1b VM
        if: always()
        run: |
          pkill -9 -f "tart run sequoia-gecko1b" 2>/dev/null || true
          sleep 2
          tart delete sequoia-gecko1b-vms 2>/dev/null || true

      - name: Summary
        if: success()
        run: |
          echo "Build complete: sequoia-gecko1b-vms"
          echo "  Registry: http://${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/v2/"
          echo "  Tag:   $BUILD_TAG"
          echo "  Alias: $ALIAS_TAG"

  build-gecko-3b:
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.role == 'both' ||
      inputs.role == 'gecko_3_b_osx_arm64'
    # Run after gecko-1b so they share the cached base VM (built by gecko-1b job)
    # and avoid racing on the Tart base VM clone step.
    needs: build-gecko-1b
    runs-on: self-hosted
    steps:
      - name: Set up PATH for Apple Silicon Homebrew
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Kill any stuck tart build processes
        run: |
          pkill -9 -f "tart run sequoia-" 2>/dev/null || true
          sleep 5

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew tap cirruslabs/cli || true
          brew install packer cirruslabs/cli/tart || true

      - name: Determine vault and tags
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ALIAS_TAG=gecko3b-prod-latest" >> $GITHUB_ENV
            echo "BUILD_TAG=gecko3b-prod-${GITHUB_SHA}" >> $GITHUB_ENV
          else
            echo "VAULT_FILE=${{ github.workspace }}/mac/builder-arm64/vault-fake.yaml" >> $GITHUB_ENV
            echo "ALIAS_TAG=gecko3b-pr-${{ github.event.pull_request.number }}-latest" >> $GITHUB_ENV
            echo "BUILD_TAG=gecko3b-pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Stage real vault (main branch only)
        if: github.ref_name == 'main'
        run: |
          install -m 600 /etc/ronin/vault-gecko3b.yaml "${GITHUB_WORKSPACE}/mac/builder-arm64/vault-gecko3b.yaml"
          echo "VAULT_FILE=${GITHUB_WORKSPACE}/mac/builder-arm64/vault-gecko3b.yaml" >> $GITHUB_ENV

      - name: Log vault hash
        run: |
          if [[ -f "${VAULT_FILE:-}" ]]; then
            sha=$(shasum -a 256 "${VAULT_FILE}" | cut -d' ' -f1)
            echo "Vault hash: ${sha:0:8}..."
          else
            echo "Vault file not found at ${VAULT_FILE:-<unset>}"
          fi

      - name: Build gecko-3b image
        working-directory: mac/builder-arm64
        env:
          ROLE: gecko_3_b_osx_arm64_vms
          # Base was already built by gecko-1b job; skip rebuild unless forced
          REBUILD_BASE: "false"
          PUPPET_BRANCH: master
        run: |
          set -euo pipefail
          export VAULT_FILE=$(realpath "${VAULT_FILE}")
          chmod +x builder.sh
          ./builder.sh

      - name: Verify registry connectivity
        run: |
          curl -fsSL http://${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/v2/ || \
            echo "Registry check returned non-200 (may still be functional)"

      - name: Push gecko-3b to OCI registry
        if: success()
        run: |
          REGISTRY="${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}"
          IMAGE="sequoia-gecko3b-vms"
          echo "Pushing ${IMAGE}:${BUILD_TAG} to ${REGISTRY}..."
          tart push ${{ env.TART_INSECURE }} ${IMAGE} ${REGISTRY}/${IMAGE}:${BUILD_TAG}
          tart push ${{ env.TART_INSECURE }} ${IMAGE} ${REGISTRY}/${IMAGE}:${ALIAS_TAG}

      - name: Clean up local gecko-3b VM
        if: always()
        run: |
          pkill -9 -f "tart run sequoia-gecko3b" 2>/dev/null || true
          sleep 2
          tart delete sequoia-gecko3b-vms 2>/dev/null || true

      - name: Summary
        if: success()
        run: |
          echo "Build complete: sequoia-gecko3b-vms"
          echo "  Registry: http://${{ env.REGISTRY_HOST }}:${{ env.REGISTRY_PORT }}/v2/"
          echo "  Tag:   $BUILD_TAG"
          echo "  Alias: $ALIAS_TAG"
